services:
  - type: web
    name: pedidos-pendientes-almacen-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /acceso
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: 10000
      - key: Demo__Enabled
        value: true
      - key: Demo__Password
        sync: false # secreto: se gestiona solo desde el panel de Render (Environment)
      - key: ConnectionStrings__Default
        sync: false # PostgreSQL persistente (Neon) para el entorno de revisión; secreto en el panel
      - key: ReverseProxy__TrustForwardedHeaders
        value: true
